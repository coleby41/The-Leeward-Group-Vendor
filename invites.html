<!DOCTYPE html>
<html lang="en" data-title="title.invites">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Vendor Portal – My Invites</title>
<link rel="icon" type="image/png" href="assets/apple-touch-icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portal.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/portal.js"></script>
</head>
<body>
<main class="main-content">
  <!-- Home (2026-11-10 redesign): greeting, action items, open invites,
       past invites, company compliance. Mockup: "Home – My Invites". -->
  <section class="vp-greet">
    <p class="vp-greet__date" id="greetDate">&nbsp;</p>
    <h1 id="greetTitle">&nbsp;</h1>
    <p id="greetSub">&nbsp;</p>
  </section>

  <div class="vp-dash">
    <div class="vp-dash__main">
      <section class="vp-section hidden" id="actionSection" aria-labelledby="actionTitle">
        <h2 id="actionTitle" data-i18n="home.actions"></h2>
        <div class="vp-action-grid" id="actionsBody"></div>
      </section>

      <section class="vp-section" aria-labelledby="openTitle">
        <div class="vp-section__head"><h2 id="openTitle" data-i18n="invites.open"></h2><span class="vp-section__meta" id="openCount"></span></div>
        <div class="vp-section" id="openBody"><p class="auth-inline-copy" data-i18n="loading"></p></div>
      </section>

      <section class="vp-section" aria-labelledby="pastTitle">
        <h2 id="pastTitle" data-i18n="invites.past"></h2>
        <div id="pastBody"><p class="auth-inline-copy" data-i18n="loading"></p></div>
      </section>
    </div>

    <aside class="vp-dash__side">
      <section class="vp-panel-navy hidden" id="compliance" aria-labelledby="complianceTitle">
        <h2 id="complianceTitle" data-i18n="home.compliance"></h2>
        <ul class="vp-checks" id="complianceList"></ul>
        <a href="profile.html" data-i18n="home.manage"></a>
      </section>
      <section class="vp-panel" aria-labelledby="helpTitle">
        <h2 id="helpTitle" data-i18n="home.help"></h2>
        <p data-i18n="home.helpBody"></p>
        <a href="faq.html" class="vp-btn-ghost" data-i18n="nav.faq"></a>
      </section>
    </aside>
  </div>
</main>
<script src="js/invites.js"></script>
</body>
</html>
