<!DOCTYPE html>
<html lang="en" data-title="title.invites">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Vendor Portal – My Invites</title>
<link rel="icon" type="image/png" href="assets/apple-touch-icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portal.css">
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/portal.js"></script>
</head>
<body>
<main class="main-content">
  <section class="hero-section">
    <div>
      <p class="eyebrow" id="heroCompany">&nbsp;</p>
      <h1 data-i18n="invites.title"></h1>
      <p data-i18n="invites.intro"></p>
    </div>
  </section>

  <div class="card bid-package-card">
    <div class="card-header"><h2 class="card-title" data-i18n="invites.open"></h2></div>
    <div id="openBody"><p class="auth-inline-copy" data-i18n="loading"></p></div>
  </div>

  <div class="card bid-package-card">
    <div class="card-header"><h2 class="card-title" data-i18n="invites.past"></h2></div>
    <div id="pastBody"><p class="auth-inline-copy" data-i18n="loading"></p></div>
  </div>
</main>
<script src="js/invites.js"></script>
</body>
</html>
