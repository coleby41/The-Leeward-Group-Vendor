<!DOCTYPE html>
<html lang="en" data-title="title.profile">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Vendor Portal – Company Profile</title>
<link rel="icon" type="image/png" href="assets/apple-touch-icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portal.css">
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/portal.js"></script>
<script src="js/vendor/supabase-js-2.45.4.js"></script>
</head>
<body>
<main class="main-content">
  <section class="hero-section">
    <div>
      <p class="eyebrow" data-i18n="profile.eyebrow"></p>
      <h1 data-i18n="profile.title"></h1>
      <p data-i18n="profile.intro"></p>
    </div>
  </section>

  <p class="auth-message error hidden" id="pageError" role="alert"></p>

  <div class="bid-review-grid hidden" id="profileGrid">
    <div class="vp-profile-grid" style="align-content: start">
      <div class="card">
        <div class="card-header"><h2 class="card-title" data-i18n="profile.company"></h2><span class="chip chip--success" data-i18n="profile.approved"></span></div>
        <form class="auth-form" id="companyForm" novalidate></form>
      </div>

      <div class="card">
        <div class="card-header"><h2 class="card-title" data-i18n="team.title"></h2></div>
        <div id="teamBody"></div>
      </div>

      <div class="card">
        <div class="card-header"><h2 class="card-title" data-i18n="profile.me"></h2></div>
        <form class="auth-form" id="meForm" novalidate></form>
      </div>
    </div>

    <div class="card" style="align-self: start">
      <div class="card-header"><h2 class="card-title" data-i18n="docs.title"></h2></div>
      <div class="vendor-profile-body" id="docsBody"></div>
    </div>
  </div>
</main>
<script src="js/profile.js"></script>
</body>
</html>
