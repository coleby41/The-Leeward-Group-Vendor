<!DOCTYPE html>
<html lang="en" data-title="title.project">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Vendor Portal – Project</title>
<link rel="icon" type="image/png" href="assets/apple-touch-icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portal.css">
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/portal.js"></script>
<script defer src="js/vendor/supabase-js-2.45.4.js"></script>
</head>
<body>
<main class="main-content">
  <!-- Locked project (Coleby, 2026-11-01): full-page "finish your
       paperwork" view — construction worker with a stop sign, one card per
       requirement (green check = ready, red X = still needed + how to fix
       it), and a Back to portal home button. No top nav or side nav here. -->
  <section class="vp-lock hidden" id="lockView"></section>

  <section class="hero-section" id="projHero">
    <div>
      <p class="eyebrow"><a href="projects.html" style="color: inherit" data-i18n="project.back"></a> · <span data-i18n="project.eyebrow"></span></p>
      <h1 id="projName">&nbsp;</h1>
      <p id="projSub">&nbsp;</p>
    </div>
  </section>

  <p class="auth-message error hidden" id="pageError" role="alert"></p>

  <div class="bid-review-grid hidden" id="projectGrid">
    <div class="vp-col">
      <!-- Locked project (Coleby, 2026-10-31): until the contract is signed,
           a W-9 is on file and this project's COI is uploaded, only this
           checklist shows — no scopes, amounts or proposals. -->
      <div class="card hidden" id="checklistCard">
        <div class="card-header"><h2 class="card-title" data-i18n="lock.title"></h2></div>
        <div class="vendor-profile-body" id="checklistBody"></div>
      </div>
      <div class="card hidden" id="contractCard">
        <div class="card-header"><h2 class="card-title" data-i18n="contract.title"></h2><span id="contractChip"></span></div>
        <div class="vendor-profile-body" id="contractBody"></div>
      </div>
      <div class="card" id="scopesCard">
        <div class="card-header"><h2 class="card-title" data-i18n="project.scopes"></h2></div>
        <div id="scopesBody"></div>
      </div>
    </div>

    <div class="card" style="align-self: start">
      <div class="card-header"><h2 class="card-title" data-i18n="project.docs"></h2><span id="coiChip"></span></div>
      <div class="vendor-profile-body" id="docsBody"></div>
    </div>
  </div>
</main>
<script src="js/project.js"></script>
</body>
</html>
