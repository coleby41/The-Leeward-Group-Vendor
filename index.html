<!DOCTYPE html>
<html lang="en" data-title="title.signin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Vendor Portal – Sign in</title>
<link rel="icon" type="image/png" href="assets/apple-touch-icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portal.css">
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/portal.js"></script>
</head>
<body>
<div class="auth-page auth-page--login vp-auth-page vp-auth-page--narrow">
  <div class="auth-shell auth-shell--solo">
    <div class="auth-card">
      <div class="auth-card__brand">
        <div class="brand-mark">
          <div class="brand-mark__icon">LG</div>
          <div>
            <div class="brand-title">The Leeward Group</div>
            <div class="brand-subtitle" data-i18n="brand.sub">Vendor Portal</div>
          </div>
        </div>
      </div>

      <a href="faq.html" class="vp-faq-strip">
        <span class="vp-faq-strip__icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4"></path><path d="M12 17h.01"></path></svg>
        </span>
        <span class="vp-faq-strip__text">
          <strong data-i18n="signin.faqTitle"></strong>
          <span data-i18n="signin.faqSub"></span>
        </span>
        <span class="vp-faq-strip__link" data-i18n="signin.faqLink"></span>
      </a>

      <div id="signinForm">
        <h1 data-i18n="signin.title"></h1>
        <p data-i18n="signin.intro"></p>
        <form class="auth-form" id="emailForm" novalidate>
          <label class="auth-field">
            <span data-i18n="signin.email"></span>
            <input type="email" name="email" id="emailInput" autocomplete="email" inputmode="email" required>
          </label>
          <p class="auth-message hidden" id="signinMessage" role="alert"></p>
          <button class="auth-button" type="submit" id="sendBtn" data-i18n="signin.send"></button>
          <div class="auth-options">
            <a class="auth-link" href="apply.html" data-i18n="signin.apply"></a>
          </div>
        </form>
      </div>

      <div id="signinSent" class="hidden">
        <h1 data-i18n="signin.sentTitle"></h1>
        <p id="sentText"></p>
        <p class="auth-inline-copy" data-i18n="signin.sentHelp"></p>
        <div class="auth-options">
          <button type="button" class="auth-link vp-linkbtn" id="differentEmailBtn" data-i18n="signin.differentEmail"></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    // Only ever a page of this site (e.g. "invite.html?id=…").
    const rawNext = params.get("next") || "";
    const next = /^[a-z0-9-]+\.html(\?[a-zA-Z0-9=&_.%-]*)?$/.test(rawNext) ? rawNext : "";
    let sentTo = "";

    // Already signed in? Go straight in.
    if (VP.getSession()) {
        VP.api("vendor-api", "me").then(d => {
            if (d && d.ok) location.replace(d.company ? (next || "invites.html") : "pending.html");
        });
    }

    function showSent() {
        $("sentText").innerHTML = VP.tHtml("signin.sentHtml", { email: sentTo });
    }
    document.addEventListener("vp:lang", () => { if (sentTo) showSent(); });

    $("emailForm").addEventListener("submit", async e => {
        e.preventDefault();
        const email = $("emailInput").value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            VP.markFields($("emailForm"), ["email"]);
            VP.setMessage($("signinMessage"), VP.t("signin.badEmail"), "error");
            return;
        }
        VP.markFields($("emailForm"), []);
        VP.setMessage($("signinMessage"), "");
        const btn = $("sendBtn");
        btn.disabled = true;
        btn.textContent = VP.t("signin.sending");
        const res = await VP.api("vendor-auth", "request_link", { email, lang: VP.lang, next });
        btn.disabled = false;
        btn.textContent = VP.t("signin.send");
        if (!res.ok) { VP.setMessage($("signinMessage"), VP.errText(res.error), "error"); return; }
        sentTo = email;
        showSent();
        $("signinForm").classList.add("hidden");
        $("signinSent").classList.remove("hidden");
    });

    $("differentEmailBtn").addEventListener("click", () => {
        sentTo = "";
        $("signinSent").classList.add("hidden");
        $("signinForm").classList.remove("hidden");
        $("emailInput").value = "";
        $("emailInput").focus();
    });
})();
</script>
</body>
</html>
